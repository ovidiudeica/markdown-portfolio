name: Site validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@b1da4809b005e0178fe08a1d57317bffc00b7b4c # v1.332.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build with locked Jekyll gems (no managed Pages container)
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: ovidiudeica/markdown-portfolio
        run: |
          bundle exec ruby -rbundler -e 'bad = Bundler.load.specs.map(&:name) & %w[github-pages jekyll-remote-theme rubyzip]; abort "Unexpected gems: #{bad.join(", ")}" unless bad.empty?'
          bundle exec jekyll build --config _config.yml,.github/pages-actions.yml

      - name: Reject Ruby gems with known advisories
        run: |
          gem install bundler-audit --version 0.9.3 --no-document
          bundle-audit check --update

      - name: Verify historic site content and preview asset
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          grep -Fq 'This is an' _site/index.html
          grep -Fq 'Emoji List' _site/index.html
          grep -Fq 'This text will be bold' _site/index.html
          test -s _site/assets/images/og-preview.png

      - name: Verify emoji rendering and literal code examples
        run: python3 .github/scripts/check-emoji.py _site/index.html

      - name: Verify portfolio Open Graph metadata and negative regressions
        run: python3 .github/scripts/check-metadata.py _site/index.html --negative-tests

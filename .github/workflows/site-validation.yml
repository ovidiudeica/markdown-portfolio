name: Site validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify historic site content and preview asset
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          grep -Fq 'This is an' _site/index.html
          grep -Fq 'Emoji List' _site/index.html
          grep -Fq 'This text will be bold' _site/index.html
          test -s _site/assets/images/og-preview.png

name: Site validation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Build and validate site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Verify historic site content and preview asset
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          grep -Fq 'This is an' _site/index.html
          grep -Fq 'Emoji List' _site/index.html
          grep -Fq 'This text will be bold' _site/index.html
          test -s _site/assets/images/og-preview.png

      - name: Verify emoji rendering and literal code examples
        run: python3 .github/scripts/check-emoji.py _site/index.html
